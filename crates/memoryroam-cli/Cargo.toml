[package]
name = "memoryroam-cli"
version = "0.1.0"
edition = "2024"
description = "Command-line interface for the MemoryRoam note kernel."
readme = "README.md"
repository = "https://github.com/JiaJunDeng5930/MemoryRoamCLI"

[[bin]]
name = "memoryroam"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
clap = { version = "4.5.48", features = ["derive"] }
memoryroam-application = { path = "../memoryroam-application" }
memoryroam-domain = { path = "../memoryroam-domain" }
memoryroam-storage-sqlite = { path = "../memoryroam-storage-sqlite" }
memoryroam-write = { path = "../memoryroam-write" }

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.23.0"
