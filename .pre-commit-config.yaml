repos:
  - repo: local
    hooks:
      - id: cargo-fmt-check
        name: cargo fmt --all -- --check
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy --workspace --all-targets -- -D warnings
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        pass_filenames: false
      - id: cargo-test
        name: cargo test --workspace
        entry: cargo test --workspace
        language: system
        pass_filenames: false
      - id: agents-md-index-check
        name: cargo xtask agents-md-index check
        entry: cargo xtask agents-md-index check
        language: system
        pass_filenames: false
