[workspace]
members = [
    "crates/memoryroam-cli",
    "crates/memoryroam-domain",
    "crates/memoryroam-read",
    "crates/memoryroam-storage-sqlite",
    "crates/memoryroam-write",
    "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
